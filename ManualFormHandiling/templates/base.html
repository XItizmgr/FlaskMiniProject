<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Home{% endblock %}</title>
    
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f9f9f9;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .container {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }
      nav {
        background-color: #2c3e50;
        padding: 15px 0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }

      nav .container {
        display: flex;
        gap: 20px;
        padding-top: 0;
        padding-bottom: 0;
      }

      nav a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      nav a:hover {
        color: #3498db;
      }

      main {
        flex: 1; 
        padding: 40px 0;
      }
      form {
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input[type="text"],
      input[type="email"],
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
      }

      button {
        background-color: #3498db;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
      }

      button:hover {
        background-color: #2980b9;
      }
      footer {
        background-color: #2c3e50;
        color: #bdc3c7;
        text-align: center;
        padding: 15px 0;
        font-size: 14px;
        margin-top: auto;
      }
    </style>
  </head>
  <body>

    <nav>
      <div class="container">
        <a href="/">Home</a>
        <a href="/thank">Feedback</a>
      </div>
    </nav>

    <main>
      <div class="container">
        {% block content %} 
        {% endblock %}
      </div>
    </main>

    <footer>
      <div class="container">
        &copy; 2026 Flask App. All rights reserved.
      </div>
    </footer>

  </body>
</html>
