{% extends "base.html" %}
{% block title %}Thank You{% endblock %}

{% block content %}
<div style="background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;">
    
    <div style="width: 70px; height: 70px; background-color: #2ecc71; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 20px auto;">
        ✓
    </div>

    <h1 style="color: #2c3e50; margin-bottom: 10px;">Submission Received!</h1>
    <p style="color: #555; font-size: 18px; margin-bottom: 30px;">
        Thank you so much for your kind feedback, <strong>{{ name }}</strong>!
    </p>

    <div style="background-color: #f8f9fa; border-left: 4px solid #3498db; padding: 20px; text-align: left; border-radius: 4px; margin-bottom: 30px;">
        <h4 style="color: #2c3e50; margin-bottom: 8px; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;">Your Message:</h4>
        <p style="color: #333; font-style: italic; margin: 0; line-height: 1.5;">
            "{{ feedback }}"
        </p>
    </div>

    <a href="/" style="display: inline-block; background-color: #3498db; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: 600; transition: background 0.2s;">
        Back to Home
    </a>

</div>
{% endblock %}
