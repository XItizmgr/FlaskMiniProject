<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Invalid Credentials</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9fafb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .error-card {
            background: #ffffff;
            padding: 3rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border-top: 5px solid #e74c3c; /* Red accent top bar */
        }

        .error-icon {
            font-size: 3.5rem;
            color: #e74c3c;
            margin-bottom: 1rem;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        p {
            color: #7f8c8d;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn-retry {
            display: inline-block;
            background-color: #e74c3c;
            color: #ffffff;
            padding: 0.8rem 2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-retry:hover {
            background-color: #c0392b;
        }

        .btn-retry:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-icon">⚠️</div>
        
        <h1>Access Denied</h1>
        <p>The username or password you entered is incorrect. Please check your credentials and try again.</p>
        
        <a href="/" class="btn-retry">Try Again</a>
    </div>

</body>
</html>
